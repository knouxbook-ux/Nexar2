version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.6-browsers
  android-executor:
    machine: true

jobs:
  install-dependencies:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Fix Expo & Peer Dependencies
          command: |
            npm install expo-font@^14.0.4 --legacy-peer-deps
            npm install expo-screen-capture@0.10.1 --legacy-peer-deps
      - run:
          name: Install Node Modules
          command: npm install --legacy-peer-deps

  run-tests:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Run Tests
          command: npm test

  build-backend:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Build Backend
          command: npm run build

  build-android:
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Build Android APK
          command: ./gradlew assembleDebug

  run-mcp-prompt:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Run Knoux AI Prompt
          command: |
            curl -X POST https://mcp.coderabbit.ai/run \
            -H "Authorization: Bearer $MCP_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "Paste here the full Knoux Nexar Prompt Block",
              "project_dir": "D:/KNOUX-NEXAR-PRO",
              "execution_mode": "full"
            }'

workflows:
  one-click-nexar-build:
    jobs:
      - install-dependencies
      - run-tests:
          requires:
            - install-dependencies
      - build-backend:
          requires:
            - run-tests
      - build-android:
          requires:
            - run-tests
      - run-mcp-prompt:
          requires:
            - build-backend
            - build-android