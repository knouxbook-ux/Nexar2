version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:20.6
  android-executor:
    machine: true

jobs:
  # 1️⃣ تثبيت dependencies
  install-dependencies:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install Node Modules
          command: npm install

  # 2️⃣ تشغيل الاختبارات
  run-tests:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Run Unit & Integration Tests
          command: npm test

  # 3️⃣ Build Backend
  build-backend:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Build Backend
          command: npm run build

  # 4️⃣ Build Android
  build-android:
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Build Android APK
          command: ./gradlew assembleDebug

  # 5️⃣ Run AI Prompt Block على MCP
  run-mcp-prompt:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Run Knoux AI Prompt
          command: |
            curl -X POST https://mcp.coderabbit.ai/run \
            -H "Authorization: Bearer $MCP_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "Paste here the full Knoux Nexar Prompt Block",
              "project_dir": "D:/KNOUX-NEXAR-PRO",
              "execution_mode": "full"
            }'

workflows:
  one-click-nexar-build:
    jobs:
      - install-dependencies
      - run-tests:
          requires:
            - install-dependencies
      - build-backend:
          requires:
            - run-tests
      - build-android:
          requires:
            - run-tests
      - run-mcp-prompt:
          requires:
            - build-backend
            - build-android